<!-- start custom comments snippet: utterances GitHub Issues comments -->
{%- if page.key -%}
  <div class="comments__title">
    <h2>留言与讨论</h2>
    <p>欢迎在这里提问、补充或指出文档问题。评论内容会关联到 GitHub Issues。</p>
  </div>
  <script src="https://utteranc.es/client.js"
          repo="nnxiong/deep-learning-guide"
          issue-term="pathname"
          label="comment"
          theme="github-light"
          crossorigin="anonymous"
          async>
  </script>
{%- endif -%}
<!-- end custom comments snippet -->
